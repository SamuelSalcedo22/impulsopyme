name: Instaladores

# Construye el .exe (Windows) y el .dmg (Mac). Se ejecuta al subir una etiqueta v* (por ejemplo v1.0.0)
# o manualmente desde la pestaña Actions. Los archivos quedan en la página Releases del repositorio.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: --win --x64
          - os: macos-13
            label: mac-intel
            args: --mac --x64
          - os: macos-latest
            label: mac-apple-silicon
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - name: Empaquetar
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ImpulsoPYME-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
